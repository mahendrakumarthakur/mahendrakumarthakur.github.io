name: Run NSE Sector Scanner

on:
  # Manual trigger only — runs on demand when you tap "Run workflow" from your iPhone or browser
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install --upgrade pip
          pip install curl_cffi

      - name: Run NSE Sector Scanner
        run: |
          set -o pipefail
          # Seed the working DB from the published history so this run APPENDS
          # to it. Without this, a fresh runner creates an empty root DB and the
          # publish step below would overwrite the history with it.
          cp data/market_scanner.db market_scanner.db
          python nse_sector_scanner.py | tee scan_output.txt
          echo "## 📊 Scan Results" >> $GITHUB_STEP_SUMMARY
          echo '```text' >> $GITHUB_STEP_SUMMARY
          cat scan_output.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          rm -f scan_output.txt

      - name: Publish database to data/ (GitHub Pages)
        run: |
          # Force-checkpoint the WAL so every row from this run is inside the
          # single .db file that gets committed (sql.js in scanner.html cannot
          # read sidecar -wal files).
          python -c "import sqlite3; db=sqlite3.connect('market_scanner.db'); db.execute('PRAGMA wal_checkpoint(TRUNCATE);'); db.close()"
          mkdir -p data
          cp market_scanner.db data/market_scanner.db

      - name: Commit and Push Updated Scans
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          # Only the published copy in data/ is committed; the root working DB
          # (and its -wal/-shm sidecars) stay untracked.
          git add data/market_scanner.db
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update scan database" && git push)
